# docker-compose.yml
services:
  coming-analysis:
    build: .
    volumes:
      - ./output:/app/output            # Analysis results
      - ./scripts:/app/scripts        # Any additional scripts
      - ./PrimeVul_v0.1:/app/PrimeVul_v0.1  # PrimeVul dataset
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

# File Structure Required
# ./code/
# ├── diff_1/
# │   └── myfile/
# │       ├── diff_1_myfile_s.c    # Source (before)
# │       └── diff_1_myfile_t.c    # Target (after)
# ├── diff_2/
# │   └── another/
# │       ├── diff_2_another_s.c
# │       └── diff_2_another_t.c
