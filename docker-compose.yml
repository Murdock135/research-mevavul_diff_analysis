# docker-compose.yml
services:
  primevul-analysis:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    image: primevul-analysis:latest
    container_name: primevul-analysis
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/app
      - GUMTREE_HOME=/opt/gumtree
      - JAVA_OPTS=-Xmx4G
    command: ["/bin/bash"]

# File Structure Required
# ./code/
# ├── diff_1/
# │   └── myfile/
# │       ├── diff_1_myfile_s.c    # Source (before)
# │       └── diff_1_myfile_t.c    # Target (after)
# ├── diff_2/
# │   └── another/
# │       ├── diff_2_another_s.c
# │       └── diff_2_another_t.c
