# docker-compose.yml
services:
  coming-analysis:
    build: .
    container_name: primevul-coming-analysis
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - PYTHONPATH=/app
    command: ["/bin/bash"]

# File Structure Required
# ./code/
# ├── diff_1/
# │   └── myfile/
# │       ├── diff_1_myfile_s.c    # Source (before)
# │       └── diff_1_myfile_t.c    # Target (after)
# ├── diff_2/
# │   └── another/
# │       ├── diff_2_another_s.c
# │       └── diff_2_another_t.c
