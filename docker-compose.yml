# docker-compose.yml
services:
  coming-analysis:
    build: .
    volumes:
      - ./code:/data/code           # Your C file pairs
      - ./output:/output            # Analysis results
    working_dir: /app
    stdin_open: true
    tty: true

# File Structure Required
# ./code/
# ├── diff_1/
# │   └── myfile/
# │       ├── diff_1_myfile_s.c    # Source (before)
# │       └── diff_1_myfile_t.c    # Target (after)
# ├── diff_2/
# │   └── another/
# │       ├── diff_2_another_s.c
# │       └── diff_2_another_t.c
