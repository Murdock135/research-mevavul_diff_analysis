apiVersion: batch/v1
kind: Job
metadata:
  name: bn1-dag-mi150-tabu10-indegnone
  namespace: gp-engine-mizzou-diff-analysis
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bn1-dag-mi150-tabu10-indegnone-ctr
          image: python:3.13-slim
          command:
            - /bin/bash
            - -lc
            - |
              set -e
              cd /workspace
              python analysis/bn1/learn_dag_isvul.py
              --method hillclimb
              --scoring-method bic-d
              --mi-threshold 150
              --tabu-length 10
              --hcs-delta 0.05
              --hcs-c 0.05
              --hcs-max-restarts 50
              --output-dir results/tune_bn1/150_tabu10_indegnone
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: diff-analysis

