[project]
name = "diff-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zayan", email = "zayan.qazi.mail@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "code-diff>=0.1.3",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pgmpy>=1.0.0",
    "pydantic>=2.12.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]

[project.scripts]
diff-analysis = "diff_analysis:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
